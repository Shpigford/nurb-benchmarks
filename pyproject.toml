[project]
name = "nurb-evals"
version = "0.1.0"
description = "The nurb LLM benchmark: score models designing 3D-printable parts"
requires-python = ">=3.13"
# shapely/networkx/rtree are trimesh's optional path-handling stack, used by the
# function tasks' retention checks (mesh cross-sections to 2D polygons).
# nurb comes from PyPI: the benchmark grades the shipped package, and the lockfile
# pins the exact version so every contributor runs the same engine.
dependencies = ["nurb>=0.23", "shapely>=2", "networkx>=3", "rtree>=1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nurb_evals"]

[tool.pytest.ini_options]
# Submitted projects carry whatever files the model wrote, and some models write a
# parts/test_part.py. Two of them collide on that basename, so a bare pytest run
# aborts at collection trying to import both as the module test_part. They are graded
# artifacts rather than tests, and the suite reads them by globbing submissions/, so
# collection has no business walking in there at all.
testpaths = ["tests"]
